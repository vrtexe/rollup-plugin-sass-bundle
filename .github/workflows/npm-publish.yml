# Bumps the version to the release tag and stages the package on npm.
# Publishing uses npm trusted publishing (OIDC) and staged publishing: this workflow can only
# submit a staged version, and a maintainer approves it with 2FA before it goes live.
# npm package settings: Trusted Publisher = GitHub Actions, this repository, workflow filename
# npm-publish.yml, allowed action "npm stage publish".

name: publish

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: |
          npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
          git config user.name "github-actions[bot]"
          git config user.email "rollup-plugin-sass-bundle+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release version $APP_VERSION" || true
          git push -u origin "HEAD:$DEFAULT_BRANCH"
        env:
          APP_VERSION: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  publish-npm:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install --global npm@^11.15.0
      - run: npm ci
      - run: npm stage publish --access public --provenance
